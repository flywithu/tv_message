blueprint:
  name: TV 켜지면 메시지 표시
  description: >
    TV가 켜졌을 때, 지정한 시간대(와 요일)이면 TV 화면에 메시지를 표시합니다.
    TV 전원 상태는 HA의 TV 엔티티(예: 내장 SamsungTV 통합의 media_player)를 사용합니다.
  domain: automation
  input:
    tv_entity:
      name: TV 엔티티
      description: 켜짐/꺼짐을 알려주는 엔티티 (media_player, switch, binary_sensor 등)
      selector:
        entity:
    tv_host:
      name: TV IP 주소
      description: 메시지를 보낼 TV 주소 (TV Message에 등록한 주소)
      default: ""
      selector:
        text:
    message:
      name: 메시지
      default: "지금은 취침시간입니다."
      selector:
        text:
          multiline: true
    duration:
      name: 표시 시간(초)
      default: 10
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: s
    repeat_minutes:
      name: 반복 간격(분)
      description: >
        0이면 TV가 켜질 때 한 번만 표시합니다. 1 이상이면 TV가 켜져 있고
        시간대 안인 동안 이 간격(분)마다 다시 표시합니다. (시계의 분 기준: 예 10 → :00, :10, :20 ...)
      default: 0
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
    start_time:
      name: 시작 시각
      default: "22:00:00"
      selector:
        time:
    end_time:
      name: 종료 시각
      description: 시작보다 이르면 자정을 넘기는 시간대(예 22:00~06:00)로 처리합니다.
      default: "06:00:00"
      selector:
        time:
    weekdays:
      name: 요일
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - { label: 월, value: mon }
            - { label: 화, value: tue }
            - { label: 수, value: wed }
            - { label: 목, value: thu }
            - { label: 금, value: fri }
            - { label: 토, value: sat }
            - { label: 일, value: sun }

mode: restart

variables:
  repeat_minutes: !input repeat_minutes

trigger:
  - platform: state
    entity_id: !input tv_entity
    to: "on"
    id: tv_on
  - platform: time_pattern
    minutes: "/1"
    id: tick

condition:
  - condition: time
    after: !input start_time
    before: !input end_time
    weekday: !input weekdays
  - condition: state
    entity_id: !input tv_entity
    state: "on"
  - condition: template
    value_template: >
      {{ trigger.id == 'tv_on'
         or (repeat_minutes | int(0) > 0
             and (now().hour * 60 + now().minute) % (repeat_minutes | int) == 0) }}

action:
  - service: tv_message.show
    data:
      message: !input message
      duration: !input duration
      host: !input tv_host
