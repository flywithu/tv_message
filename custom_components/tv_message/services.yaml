show:
  fields:
    message:
      required: true
      example: "지금은 취침시간입니다."
      selector:
        text:
          multiline: true
    duration:
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    host:
      example: "192.168.10.38"
      selector:
        text:
    background_color:
      default: "#1a1a1a"
      selector:
        text:
    text_color:
      default: "#ffffff"
      selector:
        text:
    wait_for_tv:
      default: 30
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
clear:
  fields:
    host:
      example: "192.168.10.38"
      selector:
        text:
